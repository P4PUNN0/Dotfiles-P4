# hyprlock.conf - Caelestia Shell Fusion Lockscreen
# Fused from 43PR dotfiles + Caelestia Shell (https://github.com/caelestia-dots/shell)
# docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = Google Sans Flex
$nerd_font = Iosevka Nerd Font

# Material Design / Caelestia Palette
$lock_outline = rgba(200, 196, 214, 0.6)
$lock_check = rgba(100, 220, 150, 0.8)
$lock_fail = rgba(255, 100, 100, 0.8)
$lock_font = rgba(230, 225, 227, 1.0)
$lock_date = rgba(201, 197, 199, 0.85)
$lock_media = rgba(255, 255, 255, 1.0)
$lock_password = rgba(255, 255, 255, 1.0)
$lock_time = rgba(255, 255, 255, 1.0)
$lock_layout = rgba(200, 196, 214, 1.0)
$lock_bg_bento = rgba(16, 17, 22, 0.90)
$lock_bg_card = rgba(24, 25, 33, 0.75)
$lock_bg_subcard = rgba(18, 19, 25, 0.80)
$lock_border = rgba(255, 255, 255, 0.08)
$lock_accent = rgba(0, 229, 255, 0.90)
$lock_gray = rgba(136, 136, 153, 1.0)

# Optional theme override
source = ~/dotfiles/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOutQuart, 0.165, 0.84, 0.44, 1
    animation = fadeIn, 1, 4, easeOutQuart
    animation = fadeOut, 1, 3, easeOutQuart
    animation = inputFieldDots, 1, 2, easeOutQuart
}

# Fullscreen blurred backdrop
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.8
    contrast = 0.9
}

# =========================================================================
# MAIN BENTO CONTAINER
# =========================================================================
shape {
    monitor =
    size = 940, 500
    color = $lock_bg_bento
    rounding = 24
    border_size = 1
    border_color = $lock_border
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# =========================================================================
# COLUMN 1 (LEFT): WeatherInfo, CaelestiaFetch, Spotify/Media
# =========================================================================

# 1. WEATHER CARD
shape {
    monitor =
    size = 260, 110
    color = $lock_bg_card
    rounding = 16
    border_size = 1
    border_color = $lock_border
    position = -320, 175
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-weather.sh icon
    font_size = 28
    font_family = $nerd_font
    color = $lock_accent
    position = -405, 175
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-weather.sh text
    font_size = 10
    font_family = $font
    color = $lock_font
    text_align = left
    position = -315, 175
    halign = center
    valign = center
    zindex = 3
}

# 2. CAELESTIA FETCH CARD
shape {
    monitor =
    size = 260, 195
    color = $lock_bg_card
    rounding = 16
    border_size = 1
    border_color = $lock_border
    position = -320, 10
    halign = center
    valign = center
    zindex = 2
}

# Prompt '>' badge
shape {
    monitor =
    size = 18, 18
    color = $lock_accent
    rounding = 4
    position = -430, 88
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = >
    font_size = 10
    font_family = $nerd_font
    color = rgba(10, 10, 15, 1.0)
    position = -430, 88
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = ArchiP4
    font_size = 10
    font_family = $font
    color = $lock_font
    position = -375, 88
    halign = center
    valign = center
    zindex = 3
}

# Persona 4 Logo from Kitty
image {
    monitor =
    path = /home/rodrigo/.config/hypr/assets/p4-logo.png
    size = 54
    position = -400, 14
    halign = center
    valign = center
    zindex = 3
}

# System Information
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-fetch.sh
    font_size = 10
    font_family = $nerd_font
    text_align = left
    position = -305, 14
    halign = center
    valign = center
    zindex = 3
}

# Palette Color Circles
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/lock-dots.sh
    font_size = 8
    font_family = $nerd_font
    position = -320, -55
    halign = center
    valign = center
    zindex = 3
}

# 3. SPOTIFY / NOW PLAYING CARD
shape {
    monitor =
    size = 260, 115
    color = $lock_bg_card
    rounding = 16
    border_size = 1
    border_color = $lock_border
    position = -320, -160
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-media.sh header
    font_size = 9
    font_family = $nerd_font
    color = $lock_gray
    position = -395, -118
    halign = center
    valign = center
    zindex = 3
}

# Album art cover from Spotify / MPRIS (auto-updated)
image {
    monitor =
    path = /tmp/hyprlock-cover.png
    size = 44
    rounding = 8
    border_size = 1
    border_color = $lock_border
    reload_time = 2
    position = -410, -156
    halign = center
    valign = center
    zindex = 3
}

# Song Title and Artist (Live sync with Spotify)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-media.sh text
    font_size = 10
    font_family = $font
    color = $lock_font
    text_align = left
    position = -325, -145
    halign = center
    valign = center
    zindex = 3
}

# Player Controls (Previous, Play/Pause, Next)
label {
    monitor =
    text = 󰒮
    font_size = 16
    font_family = $nerd_font
    color = $lock_font
    onclick = playerctl previous
    position = -350, -186
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-media.sh play-icon
    font_size = 16
    font_family = $nerd_font
    color = $lock_accent
    onclick = playerctl play-pause
    position = -320, -186
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = 󰒭
    font_size = 16
    font_family = $nerd_font
    color = $lock_font
    onclick = playerctl next
    position = -290, -186
    halign = center
    valign = center
    zindex = 3
}

# =========================================================================
# COLUMN 2 (CENTER): Clock, Horario/Fecha, Avatar, Password, Distribución
# =========================================================================

# CLOCK (Google Sans Flex Bold)
label {
    monitor =
    text = $TIME
    font_size = 54
    font_family = $font
    color = $lock_time
    position = 0, 160
    halign = center
    valign = center
    zindex = 3
}

# HORARIO / FECHA LOCALIZADA (Caelestia Style: DÍAS • FECHA)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_MX.UTF-8 date +"%A • %d %b" | tr '[:lower:]' '[:upper:]'
    font_size = 12
    font_family = $font
    color = $lock_date
    position = 0, 105
    halign = center
    valign = center
    zindex = 3
}

# AVATAR (Perfil de usuario ~/.face con anillo accent)
image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    border_size = 3
    border_color = $lock_accent
    position = 0, 0
    halign = center
    valign = center
    zindex = 3
}

# PASSWORD INPUT FIELD (Píldora interactiva con foco)
input-field {
    monitor =
    size = 240, 42
    outline_thickness = 1
    rounding = 21
    inner_color = rgba(22, 23, 30, 0.85)
    outer_color = rgba(255, 255, 255, 0.12)
    check_color = $lock_check
    fail_color = $lock_fail
    font_color = $lock_font
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>  Enter your password</i>
    fail_text = <i>Authentication failed</i>
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    position = 0, -95
    halign = center
    valign = center
    zindex = 3
}

# DISTRIBUCIÓN DE TECLADO (Píldora interactiva sincronizada con Hyprland)
shape {
    monitor =
    size = 130, 28
    color = rgba(24, 25, 33, 0.85)
    rounding = 14
    border_size = 1
    border_color = $lock_border
    position = 0, -145
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    font_size = 10
    font_family = $nerd_font
    color = $lock_gray
    onclick = hyprctl switchxkblayout current next
    position = 0, -145
    halign = center
    valign = center
    zindex = 4
}

# =========================================================================
# COLUMN 3 (RIGHT): Hardware Monitors (2x2) & Centro de Notificaciones
# =========================================================================

# 1. HARDWARE MONITORS CONTAINER (Resources.qml)
shape {
    monitor =
    size = 260, 220
    color = $lock_bg_card
    rounding = 16
    border_size = 1
    border_color = $lock_border
    position = 320, 122
    halign = center
    valign = center
    zindex = 2
}

# Top-Left: CPU Box
shape {
    monitor =
    size = 110, 85
    color = $lock_bg_subcard
    rounding = 12
    border_size = 1
    border_color = $lock_border
    position = 255, 165
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-hw.sh cpu
    font_size = 13
    font_family = $nerd_font
    color = $lock_font
    position = 255, 165
    halign = center
    valign = center
    zindex = 4
}

# Top-Right: Temp Box
shape {
    monitor =
    size = 110, 85
    color = $lock_bg_subcard
    rounding = 12
    border_size = 1
    border_color = $lock_border
    position = 385, 165
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-hw.sh temp
    font_size = 13
    font_family = $nerd_font
    color = $lock_font
    position = 385, 165
    halign = center
    valign = center
    zindex = 4
}

# Bottom-Left: RAM Box
shape {
    monitor =
    size = 110, 85
    color = $lock_bg_subcard
    rounding = 12
    border_size = 1
    border_color = $lock_border
    position = 255, 75
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-hw.sh ram
    font_size = 13
    font_family = $nerd_font
    color = $lock_font
    position = 255, 75
    halign = center
    valign = center
    zindex = 4
}

# Bottom-Right: Disk Box
shape {
    monitor =
    size = 110, 85
    color = $lock_bg_subcard
    rounding = 12
    border_size = 1
    border_color = $lock_border
    position = 385, 75
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-hw.sh disk
    font_size = 13
    font_family = $nerd_font
    color = $lock_font
    position = 385, 75
    halign = center
    valign = center
    zindex = 4
}

# 2. NOTIFICATIONS CONTAINER (NotifDock.qml sincronizado con Quickshell)
shape {
    monitor =
    size = 260, 205
    color = $lock_bg_card
    rounding = 16
    border_size = 1
    border_color = $lock_border
    position = 320, -105
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-notifications.sh header
    font_size = 9
    font_family = $nerd_font
    color = $lock_gray
    position = 250, -25
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-notifications.sh card
    font_size = 11
    font_family = $nerd_font
    color = $lock_font
    text_align = center
    position = 320, -115
    halign = center
    valign = center
    zindex = 3
}
